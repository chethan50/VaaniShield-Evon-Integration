<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:transparent}button{width:38px;height:38px;border:1px solid #d8c9f0;border-radius:50%;background:#f3ecff;color:#7043ad;cursor:pointer;font-size:19px}button[data-recording=true]{background:#fee2e2;color:#b91c1c;animation:pulse 1s infinite}button:focus-visible{outline:2px solid #7043ad}@keyframes pulse{50%{box-shadow:0 0 0 3px #fca5a555}}@media(prefers-reduced-motion:reduce){button{animation:none!important}}</style></head>
<body><button id="mic" type="button" aria-label="Record voice message" title="Record; click again to send">🎙</button><script src="voice.js"></script></body></html>
